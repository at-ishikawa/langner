syntax = "proto3";

package api.v1;

import "buf/validate/validate.proto";
import "api/v1/notebook.proto";

option go_package = "github.com/at-ishikawa/langner/gen-protos/api/v1;apiv1";

enum QuizType {
  QUIZ_TYPE_UNSPECIFIED = 0;
  QUIZ_TYPE_STANDARD = 1;
  QUIZ_TYPE_REVERSE = 2;
  QUIZ_TYPE_FREEFORM = 3;
  // QUIZ_TYPE_ETYMOLOGY_ORIGIN is no longer a standalone quiz mode. Etymology
  // words are quizzed through the normal vocabulary quizzes; this value now
  // only labels the origin-grouped family card the Relearn quiz builds from
  // missed vocabulary words, and tags the per-word etymology exclusion
  // (skipped_at) that drops a word from that family card. The former per-word
  // breakdown/assembly/freeform etymology modes (values 5, 6) are removed.
  QUIZ_TYPE_ETYMOLOGY_ORIGIN = 4;
  reserved 5, 6;
  // QUIZ_TYPE_RELEARN is a label-only value used by the Relearn Quiz to tag
  // where a pooled word originally came from and to name the mode in the UI.
  // It is NEVER written to a learning_logs row or a YAML quiz_type field —
  // the Relearn Quiz records no learning history at all.
  QUIZ_TYPE_RELEARN = 7;
  // QUIZ_TYPE_GRAMMAR drills grammar mistakes annotated in journal notebooks:
  // the user is shown a sentence with an incorrect span and types the fix.
  QUIZ_TYPE_GRAMMAR = 8;
}

service QuizService {
  rpc GetQuizOptions(GetQuizOptionsRequest) returns (GetQuizOptionsResponse);
  rpc StartQuiz(StartQuizRequest) returns (StartQuizResponse);
  rpc SubmitAnswer(SubmitAnswerRequest) returns (SubmitAnswerResponse);
  rpc BatchSubmitAnswers(BatchSubmitAnswersRequest) returns (BatchSubmitAnswersResponse);
  rpc StartReverseQuiz(StartReverseQuizRequest) returns (StartReverseQuizResponse);
  rpc SubmitReverseAnswer(SubmitReverseAnswerRequest) returns (SubmitReverseAnswerResponse);
  rpc BatchSubmitReverseAnswers(BatchSubmitReverseAnswersRequest) returns (BatchSubmitReverseAnswersResponse);
  rpc StartFreeformQuiz(StartFreeformQuizRequest) returns (StartFreeformQuizResponse);
  rpc SubmitFreeformAnswer(SubmitFreeformAnswerRequest) returns (SubmitFreeformAnswerResponse);
  rpc OverrideAnswer(OverrideAnswerRequest) returns (OverrideAnswerResponse);
  rpc UndoOverrideAnswer(UndoOverrideAnswerRequest) returns (UndoOverrideAnswerResponse);
  rpc SkipWord(SkipWordRequest) returns (SkipWordResponse);
  rpc ResumeWord(ResumeWordRequest) returns (ResumeWordResponse);
  // ExcludeEtymologyWord / ResumeEtymologyWord toggle ONE derived word's
  // etymology exclusion by its stable (notebook_id, expression) — the same
  // SkipWord / ResumeWord path (skipped_at) every other card's Exclude uses,
  // WITHOUT a DB note_id. Etymology words are quizzed through the normal
  // vocabulary quizzes; this exclusion drops a word from the origin-grouped
  // family card the Relearn quiz builds from missed vocabulary words (and from
  // the browse origin-detail Learn page), reading the same key
  // (IsExpressionExcludedForQuizType) the family builder reads. Used by the
  // browse origin-detail page and the Relearn origin family card's per-word
  // Exclude (quiz-ui-invariants U1/U2, learning-history L2). notebook_id is the
  // definitions-book id that owns the word — the same id the builder reads under.
  rpc ExcludeEtymologyWord(ExcludeEtymologyWordRequest) returns (ExcludeEtymologyWordResponse);
  rpc ResumeEtymologyWord(ResumeEtymologyWordRequest) returns (ResumeEtymologyWordResponse);

  // Relearn Quiz — a practice-only quiz over recently-missed words. It writes
  // NOTHING to learning history: Submit calls only the pure meaning graders,
  // never any Save/UpdateLog path, and the responses carry no next_review_date
  // or learned_at. See docs/content/proposals/relearn-quiz.
  rpc StartRelearnQuiz(StartRelearnQuizRequest) returns (StartRelearnQuizResponse);
  rpc SubmitRelearnAnswer(SubmitRelearnAnswerRequest) returns (SubmitRelearnAnswerResponse);
  rpc BatchSubmitRelearnAnswers(BatchSubmitRelearnAnswersRequest) returns (BatchSubmitRelearnAnswersResponse);

  // Grammar Quiz — corrects grammar mistakes annotated in journal notebooks.
  // Each card shows a sentence with an incorrect span; the user types the fix,
  // which is AI-graded and recorded in the notebook's learning history keyed by
  // the mistake id. See docs/content/proposals/grammar-quiz.
  rpc StartGrammarQuiz(StartGrammarQuizRequest) returns (StartGrammarQuizResponse);
  rpc SubmitGrammarPost(SubmitGrammarPostRequest) returns (SubmitGrammarPostResponse);

  // Grammar mistake review (standalone, no live session). ListGrammarMistakes
  // lists a journal's grammar mistakes — both currently-due and already-excluded
  // — for a review surface. ExcludeGrammarMistake / ResumeGrammarMistake toggle
  // a single mistake's grammar exclusion by its stable (notebook_id, sense_id),
  // WITHOUT an ephemeral session note_id: unlike SkipWord/ResumeWord (which
  // resolve an in-memory session id), these can act on a mistake that was never
  // dealt in a session, which is exactly what the review page needs.
  rpc ListGrammarMistakes(ListGrammarMistakesRequest) returns (ListGrammarMistakesResponse);
  rpc ExcludeGrammarMistake(ExcludeGrammarMistakeRequest) returns (ExcludeGrammarMistakeResponse);
  rpc ResumeGrammarMistake(ResumeGrammarMistakeRequest) returns (ResumeGrammarMistakeResponse);
}

message GetQuizOptionsRequest {
  // include_unstudied, when true, makes review counts on every
  // notebook and section reflect the "Include unstudied words" toggle
  // on the quiz start page: never-seen words and words still within
  // their SR interval are added to the due count, matching what the
  // actual quiz will load. Defaults to false (due-only counts).
  bool include_unstudied = 1;
}

message GetQuizOptionsResponse {
  repeated NotebookSummary notebooks = 1;
}

message NotebookSummary {
  string notebook_id = 1;
  string name = 2;
  int32 review_count = 3;
  string kind = 4;
  int32 reverse_review_count = 5;
  int32 etymology_review_count = 6;
  // has_content is true when any scene in the notebook has statements or
  // conversations — i.e., there is prose/dialogue to read, not just flashcards.
  bool has_content = 7;
  // sections lists the sections within this notebook in document order.
  // Sections are story events (chapters/episodes) for vocabulary notebooks
  // and session titles for etymology notebooks. Empty for flashcard or
  // definitions-only notebooks that have no section hierarchy.
  repeated NotebookSectionSummary sections = 8;
  // etymology_reverse_review_count is the per-notebook due count for the
  // etymology reverse quiz. etymology_review_count is the standard count.
  // The two can differ because the same origin can be due in one mode and
  // not in the other (each mode tracks its own SR interval and skip flag).
  int32 etymology_reverse_review_count = 9;
  // grammar_review_count is the per-notebook due count for the grammar quiz
  // (journal notebooks). Zero for non-journal notebooks.
  int32 grammar_review_count = 10;
}

// NotebookSectionSummary holds the display title and per-mode review counts
// for a single section within a notebook.
message NotebookSectionSummary {
  string title = 1;
  int32 review_count = 2;
  int32 reverse_review_count = 3;
  int32 etymology_review_count = 4;
  int32 etymology_reverse_review_count = 5;
  int32 grammar_review_count = 6;
}

// NotebookSection narrows a quiz request to specific sections within a single
// notebook. When section_titles is empty, every section of the notebook is
// included (equivalent to passing the notebook_id alone).
message NotebookSection {
  string notebook_id = 1 [
    (buf.validate.field).string.min_len = 1
  ];
  repeated string section_titles = 2;
}

message StartQuizRequest {
  repeated string notebook_ids = 1;
  bool include_unstudied = 2;
  // notebook_sections, when non-empty, replaces notebook_ids and allows the
  // caller to narrow the quiz to specific sections within each notebook.
  repeated NotebookSection notebook_sections = 3;
}

message StartQuizResponse {
  repeated Flashcard flashcards = 1;
}

message Flashcard {
  int64 note_id = 1;
  string entry = 2;
  repeated Example examples = 3;
  // original_entry is the expression as it appears in the conversation text
  // (e.g., "racked up"), while entry is the canonical/dictionary form
  // (e.g., "rack up"). Used for highlighting the expression in context.
  string original_entry = 4;

  // concept_head names the head expression of the definitions concept this
  // flashcard belongs to (empty when not a concept). When set, the UI may
  // render a "Family" chip listing concept_members and surface
  // concept_meaning as the umbrella prompt.
  string concept_head = 5;
  repeated string concept_members = 6;
  string concept_meaning = 7;
}

message Example {
  string text = 1;
  string speaker = 2;
}

message WordDetail {
  string origin = 1;
  string pronunciation = 2;
  string part_of_speech = 3;
  repeated string synonyms = 4;
  repeated string antonyms = 5;
  string memo = 6;
  repeated WordOriginPart origin_parts = 7;
}

message WordOriginPart {
  string origin = 1;
  string type = 2;
  string language = 3;
  string meaning = 4;
}

message SubmitAnswerRequest {
  int64 note_id = 1 [
    (buf.validate.field).int64.gt = 0
  ];
  // answer is the user's typed meaning. When is_skipped is true the field is
  // ignored and the backend records the result as incorrect without grading.
  string answer = 2;
  int64 response_time_ms = 3;
  bool is_skipped = 4;
}

message SubmitAnswerResponse {
  bool correct = 1;
  string meaning = 2;
  string reason = 3;
  WordDetail word_detail = 4;
  string next_review_date = 5;
  string learned_at = 6;
  repeated string images = 7;
  // sense_id is the stable source-entry identity of the answered card. The
  // frontend echoes it back on OverrideAnswer/UndoOverrideAnswer so the
  // override targets the exact sense the card came from (not the expression).
  string sense_id = 8;
}

message BatchSubmitAnswersRequest {
  repeated SubmitAnswerRequest answers = 1 [
    (buf.validate.field).repeated.min_items = 1
  ];
}

message BatchSubmitAnswersResponse {
  repeated SubmitAnswerResponse responses = 1;
}

message StartReverseQuizRequest {
  repeated string notebook_ids = 1;
  bool list_missing_context = 2;
  // notebook_sections, when non-empty, replaces notebook_ids and allows the
  // caller to narrow the quiz to specific sections within each notebook.
  repeated NotebookSection notebook_sections = 3;
  // include_unstudied mirrors the standard quiz toggle: when true, words
  // that haven't cleared the freeform/correct prerequisite (including
  // never-seen words) are included; studied words still respect their
  // reverse SR interval. Ignored when list_missing_context is set (that
  // mode lists by context presence, not review state).
  bool include_unstudied = 4;
}

message StartReverseQuizResponse {
  repeated ReverseFlashcard flashcards = 1;
}

message ReverseFlashcard {
  int64 note_id = 1;
  string meaning = 2;
  repeated ContextSentence contexts = 3;
  string notebook_name = 4;
  string story_title = 5;
  string scene_title = 6;

  // concept_head/members/meaning carry the same concept context as on
  // Flashcard; reverse quizzes accept any concept_member as a correct
  // answer when concept_head is set.
  string concept_head = 7;
  repeated string concept_members = 8;
  string concept_meaning = 9;
}

message ContextSentence {
  string context = 1;
  string masked_context = 2;
}

message SubmitReverseAnswerRequest {
  int64 note_id = 1 [
    (buf.validate.field).int64.gt = 0
  ];
  // answer is the user's guess at the word. When is_skipped is true the field
  // is ignored and the backend records the result as incorrect without grading.
  string answer = 2;
  int64 response_time_ms = 3;
  // When true, a "synonym" classification is persisted as a correct learning
  // log entry (with reduced quality). The frontend sets this on retry batches
  // where the user has already had a chance to provide the exact word.
  bool accept_synonym_as_correct = 4;
  bool is_skipped = 5;
}

message SubmitReverseAnswerResponse {
  bool correct = 1;
  string expression = 2;
  string meaning = 3;
  string reason = 4;
  repeated string contexts = 5;
  WordDetail word_detail = 6;
  string classification = 7;
  string next_review_date = 8;
  string learned_at = 9;
  repeated string images = 10;
  // sense_id — see SubmitAnswerResponse.sense_id.
  string sense_id = 11;
}

message BatchSubmitReverseAnswersRequest {
  repeated SubmitReverseAnswerRequest answers = 1 [
    (buf.validate.field).repeated.min_items = 1
  ];
}

message BatchSubmitReverseAnswersResponse {
  repeated SubmitReverseAnswerResponse responses = 1;
}

message StartFreeformQuizRequest {}

message StartFreeformQuizResponse {
  int32 word_count = 1;
  repeated string expressions = 2;
  map<string, string> expression_next_review_date = 3;
}

message SubmitFreeformAnswerRequest {
  string word = 1 [
    (buf.validate.field).string = {
      min_len: 1,
      pattern: "\\S"
    }
  ];
  string meaning = 2 [
    (buf.validate.field).string = {
      min_len: 1,
      pattern: "\\S"
    }
  ];
  int64 response_time_ms = 3;
}

message SubmitFreeformAnswerResponse {
  bool correct = 1;
  string word = 2;
  string meaning = 3;
  string reason = 4;
  string context = 5;
  string notebook_name = 6;
  WordDetail word_detail = 7;
  string next_review_date = 8;
  string learned_at = 9;
  int64 note_id = 10;
  repeated string images = 11;
  // sense_id — see SubmitAnswerResponse.sense_id.
  string sense_id = 12;
}

// Override Answer
message OverrideAnswerRequest {
  int64 note_id = 1 [
    (buf.validate.field).int64.gt = 0
  ];
  QuizType quiz_type = 2;
  string learned_at = 3 [
    (buf.validate.field).string.min_len = 10
  ];
  optional bool mark_correct = 4;
  optional string next_review_date = 5;
  // sense_id is the stable source-entry identity of the card being
  // overridden, echoed from the Submit response. When set the backend
  // routes the override to that exact sense (falling back to note_id /
  // expression for legacy id-less data).
  string sense_id = 6;
  // word_expression, when set, routes the override to a single derived
  // family word's result within the etymology-origin record identified by
  // note_id/sense_id, instead of the origin's own aggregate record. The
  // word's outcome lives inline on that ONE record (learning-history
  // invariant L1) — this never creates a second log series for the word.
  // Only meaningful when quiz_type is QUIZ_TYPE_ETYMOLOGY_ORIGIN; ignored
  // otherwise. When set, mark_correct (if present) flips the word's
  // correctness and word_excluded (if present) flips its excluded flag; the
  // origin's own aggregate result and schedule are left untouched.
  optional string word_expression = 7;
  optional bool word_excluded = 8;
}

message OverrideAnswerResponse {
  string next_review_date = 1;
  int32 original_quality = 2;
  string original_status = 3;
  int32 original_interval_days = 4;
  reserved 5;
}

// Undo Override Answer
message UndoOverrideAnswerRequest {
  int64 note_id = 1 [
    (buf.validate.field).int64.gt = 0
  ];
  QuizType quiz_type = 2;
  string learned_at = 3 [
    (buf.validate.field).string.min_len = 10
  ];
  int32 original_quality = 4;
  string original_status = 5;
  int32 original_interval_days = 6;
  reserved 7;
  // sense_id — see OverrideAnswerRequest.sense_id.
  string sense_id = 8;
}

message UndoOverrideAnswerResponse {
  bool correct = 1;
  string next_review_date = 2;
}

// Skip Word
message SkipWordRequest {
  int64 note_id = 1 [
    (buf.validate.field).int64.gt = 0
  ];
  // quiz_types lists every quiz mode the word should be excluded from. The
  // server applies the whole set in one read-modify-write so multi-type
  // skips ("All" toggle) cannot race with each other.
  repeated QuizType quiz_types = 4 [
    (buf.validate.field).repeated.min_items = 1
  ];
  string skip_until = 3;
  reserved 2;
  reserved "quiz_type";
}

message SkipWordResponse {}

// Resume Skipped Word
message ResumeWordRequest {
  int64 note_id = 1 [
    (buf.validate.field).int64.gt = 0
  ];
  // quiz_types lists every quiz mode whose skip should be cleared. Same
  // rationale as SkipWordRequest.quiz_types.
  repeated QuizType quiz_types = 3 [
    (buf.validate.field).repeated.min_items = 1
  ];
  reserved 2;
  reserved "quiz_type";
}

message ResumeWordResponse {}

// GraphPrompt is a small subgraph served as read-only elaborative scaffolding
// (no blank) on the browse etymology mindmap and, when present, on quiz
// feedback.
message GraphPrompt {
  enum Shape {
    SHAPE_UNSPECIFIED = 0;
    CLUSTER = 1;       // concept with N members, one slot blank
    ANTONYM_PAIR = 2;  // two antonym-linked concepts, one slot blank on one side
    FORM_BRANCH = 3;   // origin with forms, one form/English-word slot blank
  }
  Shape shape = 1;
  repeated GraphNode nodes = 2;
  repeated GraphEdge edges = 3;
  // blank_node_id is the id of the GraphNode whose answer the user types.
  // Always populated; v1 supports exactly one blank.
  string blank_node_id = 4;
}

message GraphNode {
  string id = 1;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    CONCEPT = 1;       // a semantic concept's meaning label
    ORIGIN = 2;        // a source-language origin
    FORM = 3;          // an inflectional form of an origin
    ENGLISH_WORD = 4;  // an English derivative
  }
  Kind kind = 2;
  // label is the visible text. Empty when this node is the blank.
  string label = 3;
  // language and hint augment the label for cues the learner needs to
  // narrow the blank: language is shown next to ORIGIN nodes (e.g.
  // "French"); hint is free text shown on the blank node (e.g. the
  // meaning of the missing English word so the user can guess uniquely).
  string language = 4;
  string hint = 5;
  // meaning is the origin's English gloss as recorded in the etymology
  // YAML (e.g. "written (past participle of scribo)"). Rendered under
  // each ORIGIN node in CLUSTER / ANTONYM_PAIR shapes so the learner
  // can see how members of the same concept relate to each other —
  // not just one specific derivation rule but whatever the YAML
  // prose says ("form of con- before b, m, p", "adverb form of bonus",
  // "uncle on the mother's side", etc.). Empty on blank nodes (no leak
  // of the answer) and on CONCEPT / FORM / ENGLISH_WORD nodes.
  string meaning = 6;
}

message GraphEdge {
  string from = 1;
  string to = 2;
  // type is a free string ("member_of", "antonym", "has_form",
  // "derives", ...) so the renderer can colour and label the edge.
  string type = 3;
}

// Relearn Quiz Messages
//
// The Relearn Quiz gathers every word answered incorrectly across all quiz
// types within a recent window and drills them in a unified recognition
// format. It is practice-only: nothing here is ever persisted to learning
// history, and the Submit response deliberately omits next_review_date and
// learned_at (there is no schedule to move and no log to override).

message StartRelearnQuizRequest {
  // window_hours is the look-back window for the wrong-word pool. 0 means
  // "use the default" (24). The server clamps the effective value to
  // [1, 168] (up to 7 days). A word qualifies when its most-recent learning
  // log inside the window has status "misunderstood".
  int32 window_hours = 1 [
    (buf.validate.field).int32 = {gte: 0, lte: 168}
  ];
}

message StartRelearnQuizResponse {
  repeated RelearnCard cards = 1;
}

message RelearnCard {
  int64 note_id = 1;
  // entry is the word (or etymology origin) — the prompt for recognition /
  // etymology-standard cards, and the answer the learner types for reverse /
  // etymology-reverse cards.
  string entry = 2;
  // source_quiz_type is the format the card is presented and graded in — the
  // quiz type it was failed in: QUIZ_TYPE_STANDARD (recognition: show entry,
  // ask meaning) or QUIZ_TYPE_REVERSE (show meaning + contexts, ask entry).
  // QUIZ_TYPE_ETYMOLOGY_ORIGIN tags a missed vocabulary word that carries an
  // etymology origin: it is a recognition card (entry=word, ask its meaning),
  // but also carries origin_text / origin_meaning so the frontend groups every
  // such card sharing an origin into ONE origin-family card (origin + meaning +
  // the missed words). Never persisted. See quiz-ui-invariants.
  QuizType source_quiz_type = 3;
  // meaning is the prompt for reverse cards and the expected answer otherwise —
  // for an etymology card it is the WORD's own meaning. Always sent so feedback
  // can show both sides.
  string meaning = 4;
  repeated Example examples = 5;          // recognition hint
  repeated ContextSentence contexts = 6;  // reverse hint (masked)
  string type = 7;                        // etymology origin type (root/prefix/suffix)
  string language = 8;                    // etymology origin language

  // Grammar display extras (empty for vocab/etymology cards). Populated when
  // source_quiz_type is QUIZ_TYPE_GRAMMAR: the live grammar quiz's inline-
  // correction card is reused to present these — the full entry text with
  // the missed span struck through and an inline box for the fix.
  string content = 9;    // the journal entry's full text (grammar)
  string incorrect = 10; // the mistaken span to correct, struck through in content

  // Etymology origin grouping (populated only when source_quiz_type is
  // QUIZ_TYPE_ETYMOLOGY_ORIGIN). origin_text is the source-language origin the
  // missed word derives from (e.g. "facere"); origin_meaning is that origin's
  // English gloss. Every etymology card sharing an origin_text/origin_meaning
  // is rendered as one family card: the origin header (origin_text +
  // origin_meaning + type + language) over the missed words. Empty otherwise.
  string origin_text = 11;
  string origin_meaning = 12;
}

message SubmitRelearnAnswerRequest {
  int64 note_id = 1 [
    (buf.validate.field).int64.gt = 0
  ];
  // answer is the user's typed meaning. Ignored when is_skipped is true.
  string answer = 2;
  int64 response_time_ms = 3;
  bool is_skipped = 4;
}

message SubmitRelearnAnswerResponse {
  bool correct = 1;
  string meaning = 2;
  string reason = 3;
  WordDetail word_detail = 4;
  repeated string images = 5;

  // Rich Learn-page context, assembled read-only from notebook/etymology data:
  // the scenes the word appears in, the etymology relation graph, and related
  // words. All optional — omitted sub-parts render nothing.
  repeated RelearnContextScene context_scenes = 6;
  GraphPrompt graph_context = 7;
  repeated string example_words = 8;

  // Grammar feedback extras (empty for vocab/etymology cards), populated
  // when the graded card's source_quiz_type was QUIZ_TYPE_GRAMMAR — mirrors
  // what the live grammar quiz's feedback card shows (see
  // GrammarFeedbackCard.tsx): the reference fix, the mistake's category,
  // and the authored grammar note (separate from `reason`, which here
  // carries the grader's critique of THIS answer).
  string correct_answer = 9;
  string category = 10;
  string grammar_note = 11;

  // literal is the etymology literal gloss for an etymology-origin card (e.g.
  // `de "down" + facere = "made down"`) — mirrors EtymologyWordResult.literal.
  // Sourced from the definitions note's free-text `note` field; empty for
  // vocab/reverse/grammar cards.
  string literal = 12;

  // NOTE: intentionally NO next_review_date and NO learned_at. The Relearn
  // Quiz writes no learning history, so there is no schedule to show and no
  // log to override.
}

// RelearnContextScene mirrors what the Learn page renders for a word: the
// prose statements and the speaker/quote conversation lines in which the
// expression appears, within one scene.
message RelearnContextScene {
  string notebook_name = 1;
  string scene_title = 2;
  repeated string statements = 3;
  repeated RelearnConversationLine conversations = 4;
}

message RelearnConversationLine {
  string speaker = 1;
  string quote = 2;
}

message BatchSubmitRelearnAnswersRequest {
  repeated SubmitRelearnAnswerRequest answers = 1 [
    (buf.validate.field).repeated.min_items = 1
  ];
}

message BatchSubmitRelearnAnswersResponse {
  repeated SubmitRelearnAnswerResponse responses = 1;
}

message StartGrammarQuizRequest {
  repeated string notebook_ids = 1;
  bool include_unstudied = 2;
  // notebook_sections narrows the quiz to specific entries within a journal
  // (each section title is a story entry / event). When empty, every entry of
  // the selected notebook_ids is included.
  repeated NotebookSection notebook_sections = 3;
}

message StartGrammarQuizResponse {
  repeated GrammarPostCard posts = 1;
}

// GrammarPostCard is one journal post shown in full, with the due mistakes to
// fix inline. The reference corrections are NOT sent to the client; the backend
// re-derives each one (by note_id) at submit time.
message GrammarPostCard {
  string notebook_id = 1;
  string entry_id = 2; // journal post id
  string title = 3;
  string post_text = 4; // the full post, shown whole
  repeated GrammarBlank blanks = 5;
}

// GrammarBlank is one mistake to correct within a post. note_id is the
// ephemeral session id (same scheme as the vocabulary quiz) so Override / Skip
// reuse the existing RPCs; sense_id is the stable correction id.
message GrammarBlank {
  int64 note_id = 1;
  string sense_id = 2;
  string incorrect = 3; // the wrong span, highlighted in place in the post
  int32 line = 4;
  string category = 5;
  string status = 6; // current learned status
}

// SubmitGrammarPost submits every blank a user filled for one post at once.
message SubmitGrammarPostRequest {
  repeated GrammarBlankAnswer answers = 1 [
    (buf.validate.field).repeated.min_items = 1
  ];
}

message GrammarBlankAnswer {
  int64 note_id = 1 [
    (buf.validate.field).int64.gt = 0
  ];
  string answer = 2;
  int64 response_time_ms = 3;
  bool is_skipped = 4;
}

message SubmitGrammarPostResponse {
  repeated GrammarBlankResult results = 1;
}

message GrammarBlankResult {
  int64 note_id = 1;
  string sense_id = 2;
  bool correct = 3;
  string correct_answer = 4; // the reference correction, revealed after grading
  string incorrect = 5;
  string reason = 6; // the authored grammar note for the mistake
  string category = 7;
  string next_review_date = 8;
  string learned_at = 9;
  // assessment is the grader's per-answer critique — what THIS answer still got
  // wrong and how to fix it. Empty when the answer was correct or skipped.
  string assessment = 10;
}

// Grammar Mistake Review Messages — a standalone review surface listing a
// journal's grammar mistakes (due + excluded) with no live quiz session.

message ListGrammarMistakesRequest {
  // notebook_id is the journal whose grammar mistakes to list.
  string notebook_id = 1 [
    (buf.validate.field).string.min_len = 1
  ];
  // section_titles, when non-empty, narrows the listing to specific journal
  // entries (each title is a story entry / event), mirroring how
  // StartGrammarQuiz narrows via NotebookSection.section_titles. When empty,
  // every entry of the notebook is included.
  repeated string section_titles = 2;
}

message ListGrammarMistakesResponse {
  repeated GrammarMistake mistakes = 1;
}

// GrammarMistake is one grammar correction as a review row. It carries the
// stable identity (sense_id, resolved against the request's notebook_id) needed
// to exclude/resume it, plus everything a review row displays. Distinct from
// GrammarBlank (a live-session blank keyed by an ephemeral note_id) because a
// review row has no session id and needs the correct/reason text up front.
message GrammarMistake {
  // sense_id is the stable correction id — the identity passed to
  // ExcludeGrammarMistake / ResumeGrammarMistake together with the journal's
  // notebook_id.
  string sense_id = 1;
  // entry_id / title identify the journal entry (post) this mistake belongs to.
  string entry_id = 2;
  string title = 3;
  string incorrect = 4; // the mistaken span
  string correct = 5;   // the reference correction
  string category = 6;
  string reason = 7;    // the authored grammar note for the mistake
  string status = 8;    // current learned status
  // is_excluded is true when this mistake is currently skipped for grammar
  // (its skipped_at is set for QUIZ_TYPE_GRAMMAR), so the row can show an
  // "Excluded" state with a Resume action instead of an Exclude action.
  bool is_excluded = 9;
}

message ExcludeGrammarMistakeRequest {
  string notebook_id = 1 [
    (buf.validate.field).string.min_len = 1
  ];
  string sense_id = 2 [
    (buf.validate.field).string.min_len = 1
  ];
}

message ExcludeGrammarMistakeResponse {}

message ResumeGrammarMistakeRequest {
  string notebook_id = 1 [
    (buf.validate.field).string.min_len = 1
  ];
  string sense_id = 2 [
    (buf.validate.field).string.min_len = 1
  ];
}

message ResumeGrammarMistakeResponse {}

message ExcludeEtymologyWordRequest {
  // notebook_id is the definitions-book id that owns the word — the same id
  // buildOriginFamilies reads its learning-history file under, exposed to the
  // client as EtymologyDefinition.notebook_name (browse page) and the origin
  // card's notebook_name (quiz feedback).
  string notebook_id = 1 [
    (buf.validate.field).string.min_len = 1
  ];
  // expression is the derived word's expression — the key SkipWord writes and
  // the loader matches (learning-history L2).
  string expression = 2 [
    (buf.validate.field).string.min_len = 1
  ];
}

message ExcludeEtymologyWordResponse {}

message ResumeEtymologyWordRequest {
  string notebook_id = 1 [
    (buf.validate.field).string.min_len = 1
  ];
  string expression = 2 [
    (buf.validate.field).string.min_len = 1
  ];
}

message ResumeEtymologyWordResponse {}

