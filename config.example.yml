# Langner Configuration

server:
  port: 8080
  cors:
    # Explicit, credentialed origins (the session cookie requires credentials,
    # which forbids a "*" wildcard). List every frontend origin that calls the
    # API. The dev frontend runs on port 3100.
    allowed_origins:
      - "http://localhost:3100"

# Google-OAuth sign-in. Auth turns ON as soon as a session signing key is set
# (via the SESSION_SIGNING_KEY env var); leave the secrets unset to run the
# server ungated for local YAML-only development.
auth:
  # Non-secret settings (safe to commit).
  google_client_id: "REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com"
  redirect_url: "http://localhost:8080/auth/google/callback"
  frontend_url: "http://localhost:3100"
  # Only these Google emails may sign in (registration = first sign-in).
  allowed_emails:
    - "admin@example.com"
  initial_admin_email: "admin@example.com"
  cookie_secure: true
  cookie_samesite: lax
  # SECRETS — provide via environment variables ONLY, never in this file:
  #   GOOGLE_CLIENT_SECRET        the OAuth client secret
  #   SESSION_SIGNING_KEY         HMAC key that signs the session cookie
  #   CREDENTIAL_ENCRYPTION_KEY   32-byte (hex/base64) AES-256 key that encrypts
  #                               user email/name at rest — MUST differ from
  #                               SESSION_SIGNING_KEY

database:
  host: localhost
  port: 5432
  database: local
  username: user
  password: password
  tls: false
  # Additional PostgreSQL driver parameters
  # params:
  #   application_name: langner
  #   sslmode: disable
  # Connection pool settings
  # max_open_conns: 25
  # max_idle_conns: 5
  # conn_max_lifetime_seconds: 300

notebooks:
  # Single base directory: every notebook dir below derives from it
  # (<base>/stories, <base>/journal, <base>/journal-corrections, …). An
  # explicit *_directories entry overrides its derived default.
  base_directory: notebooks

  # Directories containing story notebooks (supports multiple directories)
  stories_directories:
    - examples/stories

  # Directories containing journal notebooks — the learner's own writing, stored
  # in the story format but kept apart from stories. Loaded alongside stories.
  journals_directories:
    - examples/journals

  # Directories containing flashcard notebooks (supports multiple directories)
  flashcards_directories:
    - examples/flashcards

  # Directories containing book notebooks (auto-generated from ebooks)
  books_directories:
    - examples/books

  # Directories containing definitions for books (separate from auto-generated content)
  definitions_directories:
    - examples/definitions

  # Directories containing etymology notebooks (roots, prefixes, suffixes)
  etymology_directories:
    - examples/etymology

  # Directories containing grammar-annotation notebooks. Each attaches grammar
  # mistakes to a story (by entry title) — the parallel of definitions — and is
  # drilled by the grammar quiz. The prose itself is a normal story under
  # stories_directories (a journal is just a story).
  grammars_directories:
    - examples/grammars

  # Directory containing learning notes/history
  learning_notes_directory: examples/learning_notes

books:
  # Directory where ebook repositories are cloned
  repo_directory: ebooks

  # YAML file tracking cloned repositories
  repositories_file: books.example.yml

dictionaries:
  rapidapi:
    # Directory for RapidAPI dictionary cache
    cache_directory: examples/dictionaries/rapidapi

templates:
  # Path to the story notebook template file (optional)
  # If not specified or left empty, uses the embedded default template
  # story_notebook_template: assets/templates/story-notebook.md.go.tmpl

  # Path to the flashcard notebook template file (optional)
  # If not specified or left empty, uses the embedded default template
  # flashcard_notebook_template: assets/templates/flashcard-notebook.md.go.tmpl

outputs:
  # Directory for story notebook output files
  story_directory: examples/outputs

  # Directory for flashcard notebook output files
  flashcard_directory: examples/outputs

  # Directory for etymology notebook output files
  etymology_directory: examples/outputs

  # Directory for per-day quiz-review output files generated by
  # `langner notebooks quiz-review [YYYY-MM-DD]`. One markdown (and
  # optional PDF) file per notebook lands under
  # <quiz_review_directory>/<date>/<notebookID>.md. When unset, the
  # command falls back to story_directory.
  quiz_review_directory: examples/outputs
