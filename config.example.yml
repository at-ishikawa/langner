# Langner Configuration

server:
  port: 8080
  cors:
    # Explicit, credentialed origins (the session cookie requires credentials,
    # which forbids a "*" wildcard). List every frontend origin that calls the
    # API. The dev frontend runs on port 3100.
    allowed_origins:
      - "http://localhost:3100"

# Google-OAuth sign-in. Auth turns ON as soon as a session signing key is set
# (via the SESSION_SIGNING_KEY env var); leave the secrets unset to run the
# server ungated for local YAML-only development.
auth:
  # Non-secret settings (safe to commit).
  google_client_id: "REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com"
  redirect_url: "http://localhost:8080/auth/google/callback"
  frontend_url: "http://localhost:3100"
  # Only these Google emails may sign in (registration = first sign-in).
  allowed_emails:
    - "admin@example.com"
  # Optional. Only used to auto-backfill pre-auth history during the automated
  # `migrate import-db` seed (e2e). For a real one-time cutover, sign in with
  # Google first, then run `langner auth backfill --user-id <your id>` (run it
  # with no flag to list ids) — nothing here is needed. The server never reads
  # this field.
  initial_admin_email: "admin@example.com"
  cookie_secure: true
  cookie_samesite: lax
  # SECRETS — keep out of committed files; env var or a private/uncommitted config:
  #   GOOGLE_CLIENT_SECRET   the OAuth client secret
  #   SESSION_SIGNING_KEY    key that signs the session cookie + OAuth CSRF state
  #                          (e.g. `openssl rand -hex 32`)
  #   TOKEN_SIGNING_KEY      key that signs the CLI/bearer access JWT (HS256).
  #                          Set this to enable `langner login`/`logout`/`whoami`
  #                          (the RFC 8628 device flow) and to accept
  #                          `Authorization: Bearer` ALONGSIDE the session cookie.
  #                          Its own secret (e.g. `openssl rand -hex 32`); no
  #                          fallback to SESSION_SIGNING_KEY.
  # No email/name is stored, so there is no credential-encryption key.

# Notebook ownership + public/private visibility (auth Phase 3). Content stays a
# shared global catalog; this overlay decides who may SEE each notebook. A
# notebook_id NOT listed here has no ownership row and is therefore PUBLIC (all
# logged-in users see it). A private notebook is visible only to its owner.
# owner_email must be an auth account (allowed_emails / initial_admin_email).
# Provisioned into the `notebooks` table by `langner auth provision` (also run
# inside `migrate import-db`); adjust ad hoc with `langner notebooks set-owner`.
# NOTE: owner_email here find-or-creates a TOOLING account (google_sub
# "e2e-test|<email>") — correct for the e2e/dev seed (the test cookie is that
# same synthetic account), but NOT what a real Google sign-in resolves to. For a
# PRODUCTION private notebook, assign the owner to your REAL account instead:
# sign in with Google, then `langner notebooks set-owner --notebook-id <id>
# --user-id <your id> --visibility private` (run `langner auth backfill` with no
# flag to list account ids). A synthetic owner would make a private notebook
# visible to nobody who actually signs in.
notebook_ownership:
  # The example private book: only the (tooling) admin account sees it.
  - notebook_id: visibility-private-demo
    owner_email: "admin@example.com"
    visibility: private
  # The example public book, stated explicitly (any unlisted notebook is public
  # too — this row just documents the intent and pins the owner).
  - notebook_id: visibility-public-demo
    owner_email: "admin@example.com"
    visibility: public

database:
  host: localhost
  port: 5432
  database: local
  username: user
  password: password
  tls: false
  # Additional PostgreSQL driver parameters
  # params:
  #   application_name: langner
  #   sslmode: disable
  # Connection pool settings
  # max_open_conns: 25
  # max_idle_conns: 5
  # conn_max_lifetime_seconds: 300

# Which inference provider grades quiz answers.
inference:
  # mode selects the provider:
  #   openai (default) — OpenAI Chat Completions (needs OPENAI_API_KEY)
  #   gemini           — Google Gemini via its OpenAI-compatible endpoint
  #                      (needs GEMINI_API_KEY)
  #   mock             — deterministic substring grader (used by e2e tests)
  # The INFERENCE_MODE environment variable overrides this value, e.g.
  # `INFERENCE_MODE=gemini make dev`.
  mode: openai

# OpenAI provider. The API key and model are read from environment variables
# ONLY (never from this file): OPENAI_API_KEY and OPENAI_MODEL. OPENAI_MODEL
# defaults to gpt-4o-mini.

# Google Gemini provider. Like OpenAI, credentials come from environment
# variables ONLY: GEMINI_API_KEY and GEMINI_MODEL. GEMINI_MODEL defaults to the
# free-tier model gemini-3.5-flash-lite. Select this provider with inference.mode:
# gemini above.

notebooks:
  # Single base directory: every notebook dir below derives from it
  # (<base>/stories, <base>/journal, <base>/journal-corrections, …). An
  # explicit *_directories entry overrides its derived default.
  base_directory: notebooks

  # Directories containing story notebooks (supports multiple directories)
  stories_directories:
    - examples/stories

  # Directories containing journal notebooks — the learner's own writing, stored
  # in the story format but kept apart from stories. Loaded alongside stories.
  journals_directories:
    - examples/journals

  # Directories containing flashcard notebooks (supports multiple directories)
  flashcards_directories:
    - examples/flashcards

  # Directories containing book notebooks (auto-generated from ebooks)
  books_directories:
    - examples/books

  # Directories containing definitions for books (separate from auto-generated content)
  definitions_directories:
    - examples/definitions

  # Directories containing etymology notebooks (roots, prefixes, suffixes)
  etymology_directories:
    - examples/etymology

  # Directories containing grammar-annotation notebooks. Each attaches grammar
  # mistakes to a story (by entry title) — the parallel of definitions — and is
  # drilled by the grammar quiz. The prose itself is a normal story under
  # stories_directories (a journal is just a story).
  grammars_directories:
    - examples/grammars

  # Directory containing learning notes/history
  learning_notes_directory: examples/learning_notes

books:
  # Directory where ebook repositories are cloned
  repo_directory: ebooks

  # YAML file tracking cloned repositories
  repositories_file: books.example.yml

dictionaries:
  rapidapi:
    # Directory for RapidAPI dictionary cache
    cache_directory: examples/dictionaries/rapidapi

templates:
  # Path to the story notebook template file (optional)
  # If not specified or left empty, uses the embedded default template
  # story_notebook_template: assets/templates/story-notebook.md.go.tmpl

  # Path to the flashcard notebook template file (optional)
  # If not specified or left empty, uses the embedded default template
  # flashcard_notebook_template: assets/templates/flashcard-notebook.md.go.tmpl

outputs:
  # Directory for story notebook output files
  story_directory: examples/outputs

  # Directory for flashcard notebook output files
  flashcard_directory: examples/outputs

  # Directory for etymology notebook output files
  etymology_directory: examples/outputs

  # Directory for per-day quiz-review output files generated by
  # `langner notebooks quiz-review [YYYY-MM-DD]`. One markdown (and
  # optional PDF) file per notebook lands under
  # <quiz_review_directory>/<date>/<notebookID>.md. When unset, the
  # command falls back to story_directory.
  quiz_review_directory: examples/outputs
