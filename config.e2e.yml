server:
  port: 8080
  cors:
    allowed_origins:
      - "http://localhost:3100"

# Auth is enabled in e2e with FIXED test keys (not secret — test-only) so the
# harness can mint a session cookie deterministically via
# `langner auth issue-test-cookie`. cookie_secure:false because e2e runs over
# plain http.
auth:
  google_client_id: "e2e-test-client-id"
  redirect_url: "http://localhost:8080/auth/google/callback"
  frontend_url: "http://localhost:3100"
  allowed_emails:
    - "e2e@example.com"
  initial_admin_email: "e2e@example.com"
  cookie_secure: false
  cookie_samesite: lax
  # Test-only fixed keys. session_signing_key is an arbitrary HMAC key;
  # credential_encryption_key is 64 hex chars = 32 bytes for AES-256.
  session_signing_key: "e2e-fixed-session-signing-key-do-not-use-in-prod"
  credential_encryption_key: "e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2"

database:
  host: 127.0.0.1
  port: 5432
  database: langner_e2e
  username: postgres
  password: password
  tls: false

inference:
  mode: mock

quiz:
  # Preserve fixture order so e2e scenarios can assert which card appears first.
  disable_shuffle: true

notebooks:
  stories_directories:
    - frontend/e2e/fixtures/stories
  journals_directories:
    - frontend/e2e/fixtures/journals
  flashcards_directories:
    - frontend/e2e/fixtures/flashcards
  books_directories: []
  definitions_directories:
    - frontend/e2e/fixtures/definitions
  etymology_directories:
    - frontend/e2e/fixtures/etymology
  grammars_directories:
    - frontend/e2e/fixtures/grammars
  learning_notes_directory: frontend/e2e/fixtures/learning_notes

books:
  repo_directory: frontend/e2e/fixtures/ebooks
  repositories_file: frontend/e2e/fixtures/books.yml

dictionaries:
  rapidapi:
    cache_directory: frontend/e2e/fixtures/dictionaries/rapidapi

outputs:
  story_directory: frontend/e2e/fixtures/outputs
  flashcard_directory: frontend/e2e/fixtures/outputs
  etymology_directory: frontend/e2e/fixtures/outputs
