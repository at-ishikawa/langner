name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'backend/go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.1
          working-directory: backend

  test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'backend/go.mod'
      - name: Run tests with coverage check
        run: make test-coverage

  validate-examples:
    name: Validate example configurations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: local
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd="pg_isready -U user -d local"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'backend/go.mod'

      - name: Build langner
        run: cd backend && go build -o ../langner ./cmd/langner

      - name: Run langner validate
        run: ./langner validate --config config.example.yml

      - name: Output markdown and PDF files
        run: ./langner --config config.example.yml notebooks stories friends --pdf

      - name: Install migrate tool
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run database migrations
        run: migrate -source file://backend/schemas/migrations -database "postgres://user:password@localhost:5432/local?sslmode=disable" up

      - name: Import example data to DB
        run: ./langner migrate import-db --config config.example.yml
        env:
          DB_PASSWORD: password

      - name: Run langner validate (with DB consistency)
        run: ./langner validate --config config.example.yml
        env:
          DB_PASSWORD: password

      - name: Run langner migrate validate-db
        run: ./langner migrate validate-db --config config.example.yml
        env:
          DB_PASSWORD: password

      # Live-Postgres RPC-level coverage: every quiz-type Submit path
      # runs against the real DB with MultiLearningRepository
      # (YAML+DB), matching production wiring. Repeating the same
      # answer twice reproduces the ensureNoteExists race that
      # silently hit "duplicate key value violates unique constraint
      # notes_usage_entry_key" in the user's real setup. Each subtest
      # resets its own schema so ordering with the other examples-
      # config steps below doesn't matter.
      #
      # This is the coverage that should have existed from the start
      # of the Postgres migration. sqlmock unit tests match SQL
      # patterns but can't verify actual Postgres constraint
      # semantics; import-db CI exercises a different code path
      # (BatchCreate, not Create+ensureNoteExists) than quiz answers.
      #
      # -p 1 serializes the three package test binaries: they share ONE
      # Postgres and both the quiz-answer path (ensureNoteExists) and the
      # note repo (insertNoteReturningID) now find-or-create via ON CONFLICT,
      # which takes index locks that can DEADLOCK (40P01) if two packages
      # write the notes table concurrently. Same isolation the drift/pipeline
      # step below uses.
      - name: Integration tests — quiz RPCs + repository against live Postgres
        working-directory: backend
        run: go test -count=1 -p 1 -run "LivePostgres_Integration" ./internal/learning/ ./internal/server/ ./internal/notebook/
        env:
          LANGNER_INTEGRATION_DB_URL: postgres://user:password@localhost:5432/local?sslmode=disable

      # The table-dump round-trip test CLEARS and RESTORES every table, so it
      # must own the database for its run. It cannot share the combined step
      # above: the quiz-integration packages each reset the schema their own
      # way (DROP SCHEMA / TRUNCATE) as they run in sequence against this one
      # Postgres, and those interleaved resets corrupt the round-trip test's
      # state (seen in CI as both a stale-rows duplicate-key AND a missing
      # schema_migrations, depending on which sibling ran last). Give it its
      # own step with a freshly-recreated, empty schema so nothing else touches
      # the DB while it runs.
      - name: Integration test — DB table-dump round-trip (isolated, fresh schema)
        run: |
          PGPASSWORD=password psql -h localhost -U user -d local -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          cd backend && go test -count=1 -run TestTableDumpRoundTrip_LivePostgres_Integration ./cmd/langner/
        env:
          LANGNER_INTEGRATION_DB_URL: postgres://user:password@localhost:5432/local?sslmode=disable

      # Exercise sync-db against the live Postgres so its destructive
      # clear+reimport path is covered by CI. Catches regressions like
      # the MySQL-era SET foreign_key_checks that broke on PG, or a
      # future TRUNCATE against tables that a migration forgot to
      # create.
      - name: Run langner migrate sync-db
        run: ./langner migrate sync-db --config config.example.yml
        env:
          DB_PASSWORD: password

      # And once more against a table-less schema — this is what a
      # fresh Postgres looks like before migrations run. Catches the
      # class of bug where sync-db assumed tables already existed.
      # DROP + CREATE SCHEMA public wipes every table and sequence in
      # one shot without needing to drop the whole database.
      - name: Drop all tables so the database is empty
        run: PGPASSWORD=password psql -h localhost -U user -d local -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'

      - name: Run langner migrate sync-db on empty DB
        run: ./langner migrate sync-db --config config.example.yml
        env:
          DB_PASSWORD: password

      # Realistic-dataset coverage for the import-db path that the fresh
      # example schema never exercised: the FULL import pipeline built from
      # config.example.yml (cmd/langner) importing HOMOGRAPHS (bank-finance
      # vs bank-river — the duplicate-key crash on the user's real DB) and a
      # MULTI-NOTEBOOK word (dedup to one note), plus the import-db pre-flight
      # schema-drift check (internal/database) that turns a renumbered /
      # older migration chain into a clear, actionable error instead of a
      # cryptic deep column-scan crash.
      #
      # It ALSO runs the sync-db DRIFT + DIRTY rebuild regression
      # (TestSyncDB_DriftedDirtySchema_... / TestMigrate022DropConstraint_...):
      # they seed the user's obsolete part_of_speech-era schema + a DIRTY
      # schema_migrations marker and assert the real sync-db command rebuilds
      # the managed tables from scratch, re-migrates clean, and imports — twice
      # (idempotent). They match the -run "LivePostgres_Integration" filter and
      # self-reset their schema, so they share this isolated step.
      #
      # These tests DROP + recreate the public schema each subtest, so they
      # must NOT share a `go test` invocation with the row-scoped live-PG
      # tests above. Its own step, freshly recreated schema, and -p 1 so the
      # two destructive packages never run concurrently against the one
      # shared Postgres (see the shared-DB isolation note in
      # verify-data-features-with-example-notebooks.md).
      - name: Recreate empty schema for drift + import-pipeline tests
        run: PGPASSWORD=password psql -h localhost -U user -d local -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'

      - name: Integration tests — import-db + sync-db drift/dirty rebuild + homograph/multi-notebook pipeline
        working-directory: backend
        run: go test -count=1 -p 1 -run "LivePostgres_Integration" ./internal/database/ ./cmd/langner/
        env:
          LANGNER_INTEGRATION_DB_URL: postgres://user:password@localhost:5432/local?sslmode=disable
