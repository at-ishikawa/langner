# Runs the EXISTING Playwright e2e suite against the deployed Vercel PREVIEW for
# this PR — the real serverless + DB-backed environment where filesystem-vs-DB
# and env-wiring bugs actually surface (a single-process local e2e cannot catch
# those). The local e2e in frontend.yml still runs for everyone (incl. forks);
# this job adds the "does it work on Vercel" layer for trusted PRs.
#
# HOW IT SEEDS (no DB credentials on the runner): the backend exposes a
# preview-only endpoint, POST /internal/e2e/seed, guarded by a shared secret
# (E2E_SEED_SECRET). The runner curls it; the backend — which already holds the
# DB creds + signing key — resets the preview's learning STATE to the e2e
# baseline and returns a freshly-minted e2e bearer. The runner therefore needs
# NO database credential, NO TOKEN_SIGNING_KEY, and NO Vercel token: just the one
# shared secret it sends in the header.
#
# SETUP REQUIRED (one-time, by a maintainer):
#   1. Backend Vercel project, Preview scope (you set these to run previews
#      anyway):
#        E2E_SEED_SECRET = <a long random string>   (mounts + guards the endpoint)
#        INFERENCE_MODE = mock                       (deterministic grading)
#        TOKEN_SIGNING_KEY, DB_HOST/PORT/USER/PASSWORD/NAME → the preview Supabase
#        AUTH_INITIAL_ADMIN_EMAIL = e2e@example.com  (the account the token/history use)
#        AUTH_ALLOWED_EMAILS = e2e@example.com
#        CORS_ALLOWED_ORIGINS = https://langner-git-*-at-ishikawa.vercel.app
#   2. ONE GitHub repo secret: E2E_SEED_SECRET — the SAME value as (1). It is the
#      only secret in GitHub; until it is set this job SKIPS (green/neutral),
#      never a red required check.
#   3. CONTENT, once: the serverless backend has no fixture files on disk, so the
#      endpoint resets STATE only. Import the e2e notebook CONTENT into the
#      preview Supabase a single time (content survives the per-PR reset), from a
#      checkout of this repo with the preview DB_* exported:
#        langner-admin migrate seed-e2e --config config.e2e.yml
#
# CAVEAT: a preview may serve from a single warm instance, so this does NOT
# deterministically reproduce the cross-instance "card not found" class — that
# stays guarded by the Go handler tests. This job's job is the wiring/env class.
name: E2E (Vercel preview)

on:
  pull_request:

# Least privilege for the built-in GITHUB_TOKEN: this job only reads deployment
# status. (Fork PRs get a read-only token AND no secrets regardless.)
permissions:
  contents: read
  deployments: read

jobs:
  e2e-preview:
    # Same-repo PRs only: fork PRs get no secrets from GitHub (by design) and we
    # must never run a fork's test code with secrets — forks are covered by the
    # local e2e in frontend.yml instead.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      # Serialize: all runs reset the one shared preview database.
      group: e2e-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Enablement = "is E2E_SEED_SECRET set?". No separate feature flag to keep
      # in sync: if the maintainer hasn't configured the secret yet, every later
      # step is skipped and the job ends green (neutral), never a red check.
      - name: Gate on E2E_SEED_SECRET presence
        id: gate
        env:
          E2E_SEED_SECRET: ${{ secrets.E2E_SEED_SECRET }}
        run: |
          if [ -n "$E2E_SEED_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_SEED_SECRET not configured — skipping preview e2e."
          fi

      - name: Wait for the Vercel frontend preview to be READY
        if: steps.gate.outputs.enabled == 'true'
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 12 * 60 * 1000;
            while (Date.now() < deadline) {
              const deps = await github.rest.repos.listDeployments({
                owner: context.repo.owner, repo: context.repo.repo, sha,
              });
              // Frontend project "langner"; exclude the "langner-api" backend env.
              const dep = deps.data.find(
                (d) => /langner/i.test(d.environment) && !/langner-api/i.test(d.environment),
              );
              if (dep) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner, repo: context.repo.repo, deployment_id: dep.id,
                });
                const ready = statuses.data.find((s) => s.state === "success" && s.target_url);
                if (ready) { core.setOutput("url", ready.target_url); return; }
                if (statuses.data.some((s) => ["failure", "error"].includes(s.state))) {
                  throw new Error("frontend preview deployment failed");
                }
              }
              await new Promise((r) => setTimeout(r, 15000));
            }
            throw new Error("timed out waiting for the frontend preview deployment");

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version-file: frontend/.node-version

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 10

      - name: Install frontend deps
        if: steps.gate.outputs.enabled == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Seed over HTTP: the backend preview resets its own DB + mints the bearer.
      # The backend preview URL shares this PR's branch slug and account scope —
      # derive it from the frontend URL by swapping the project-name prefix
      # (langner-git- → langner-api-git-), the same mapping next.config uses.
      - name: Seed the preview via the backend endpoint + capture the e2e token
        if: steps.gate.outputs.enabled == 'true'
        env:
          FRONTEND_URL: ${{ steps.preview.outputs.url }}
          E2E_SEED_SECRET: ${{ secrets.E2E_SEED_SECRET }}
        run: |
          set -euo pipefail
          BACKEND_URL="${FRONTEND_URL/langner-git-/langner-api-git-}"
          echo "Seeding ${BACKEND_URL}/internal/e2e/seed"
          resp="$(curl -fsS -X POST "${BACKEND_URL}/internal/e2e/seed" \
            -H "X-E2E-Seed-Secret: ${E2E_SEED_SECRET}")"
          mkdir -p frontend/e2e/.auth
          printf '%s' "$(printf '%s' "$resp" | jq -r .token)" > frontend/e2e/.auth/access-token.txt
          test -s frontend/e2e/.auth/access-token.txt

      - name: Run Playwright against the preview
        if: steps.gate.outputs.enabled == 'true'
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
        run: |
          npx playwright install chromium --with-deps
          pnpm test:e2e
