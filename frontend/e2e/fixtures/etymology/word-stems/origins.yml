# A second etymology notebook so a scenario can run the Etymology Origin
# quiz against its own pair of origins (scribo, dico) independently of
# Word Roots. Both origins have a derived-word family in the matching
# definitions notebook, so each shows up as a grouped origin card.
metadata:
  title: "Word Stems"
origins:
  - origin: scribo
    type: root
    language: Latin
    meaning: write
  - origin: dico
    type: root
    language: Latin
    meaning: say
