# A journal is stored as a story (scenes → statements), exactly like a book or a
# transcript. Its grammar mistakes live in a separate grammars notebook, matched
# to each entry by title — the same split as a book and its definitions.
- event: "Party"
  date: 2026-07-05T00:00:00Z
  scenes:
